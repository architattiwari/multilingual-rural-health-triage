[project]
name = "rural-health-triage-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["../database/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]  # asserts are used in tests and for invariants; FastAPI uses Depends in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"app/clinical/lexicon.py" = ["E501"]
"app/clinical/language.py" = ["E501"]
"evaluation/*" = ["E402", "I001"]
"app/services/localization.py" = ["E501"]
"app/clinical/questions.py" = ["E501"]
"app/clinical/rules.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
